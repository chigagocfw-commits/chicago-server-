  <link rel="stylesheet" crossorigin href="./assets/index-Dsixt-4k.css">
  <script>
    (function(){
      function applyCss(css){
        if(!css) return;
        var existing = document.querySelector('style[data-runtime-colors="1"]');
        if(existing) existing.remove();
        var s = document.createElement('style');
        s.setAttribute('data-runtime-colors','1');
        s.textContent = css;
        document.head.appendChild(s);
        console.log('[colors.css] injected via DUI message,', css.length, 'chars');
      }
      window.addEventListener('message', function(e){
        var d = e.data;
        if(typeof d === 'string'){ try { d = JSON.parse(d); } catch(_){ return; } }
        if(!d || d.action !== 'theme:setColors' || !d.data) return;
        applyCss(d.data.css);
      });
    })();
  </script>
