<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;width:100%;height:100%;background:#00e5b4}</style></head>
<body><script>
const clean = value => String(value || '').replace(/[^0-9a-f]/gi, '').slice(0, 6);
const paint = value => { const hex = clean(value); if (hex.length === 6) document.body.style.background = `#${hex}`; };
paint(new URLSearchParams(location.search).get('c'));
window.addEventListener('message', event => { if (event.data && event.data.color) paint(event.data.color); });
</script></body></html>
