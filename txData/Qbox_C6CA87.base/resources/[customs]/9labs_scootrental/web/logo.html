<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1024" height="1024"></canvas><script>
const q = new URLSearchParams(location.search);
const ctx = document.getElementById('c').getContext('2d');

const load = src => new Promise(res => {
    const img = new Image();
    img.onload = () => res(img);
    img.onerror = () => res(null);
    img.src = src;
});

(async () => {
    const base = await load('../' + (q.get('base') || 'logo/base_door.png'));
    if (base) ctx.drawImage(base, 0, 0, 1024, 1024);

    const logo = await load('../' + (q.get('logo') || 'logo/logo.png'));
    if (!logo) return;

    const size = Math.max(0.05, Math.min(1.5, Number(q.get('size')) || 0.7)) * 1024;
    const x = (Number(q.get('x')) || 0.5) * 1024;
    const y = (Number(q.get('y')) || 0.5) * 1024;
    const turn = (Number(q.get('turn')) || 0) * Math.PI / 180;
    const ratio = logo.width && logo.height ? logo.width / logo.height : 1;
    const w = ratio >= 1 ? size : size * ratio;
    const h = ratio >= 1 ? size / ratio : size;

    ctx.translate(x, y);
    ctx.rotate(turn);
    ctx.drawImage(logo, -w / 2, -h / 2, w, h);
})();
</script></body></html>
