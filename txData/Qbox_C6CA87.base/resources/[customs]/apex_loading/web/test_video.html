<!DOCTYPE html>
<html>
<body>
<video id="v" autoplay muted playsinline src="media/chicago.video.mp4"></video>
<script>
const v = document.getElementById('v');
v.onloadeddata = () => console.log('EVENT: LOADEDDATA');

</html>
